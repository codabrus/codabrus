<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
</head>
<body>

<div id="diagram" style="width: 100%; height: 600px;"></div>

<script type="module">
  import initDiagram from '/build/diagram.js'

  initDiagram('diagram', {
    nodes: [
      { id: 'n1', x: 80, y: 80, width: 100, height: 40, label: 'Hello' },
      { id: 'n2', x: 280, y: 180, width: 100, height: 40, label: 'Мир' }
    ],
    edges: [
      { source: 'n1', target: 'n2' }
    ]
  })
</script>

</body>
</html>
